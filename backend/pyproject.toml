[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "models",
    "uploads",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "E712",   # Comparison to True/False (required for SQLAlchemy query filters: Column == False)
    "E402",   # Module level import not at top of file (used when load_dotenv runs first)
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
