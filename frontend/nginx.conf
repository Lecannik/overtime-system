server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Статические ассеты с уникальными хэшами (JS, CSS, изображения)
    # Если файл не найден — возвращаем 404, а не index.html (предотвращает MIME type error)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Запрет кеширования главного HTML-файла приложения
    # Гарантирует, что пользователи всегда получают актуальные хэши JS/CSS после деплоя
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA Routing (все пути передаются в React Router)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
